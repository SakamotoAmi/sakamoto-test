<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flower Puyo Puyo Game</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background: linear-gradient(135deg, #e0f7fa, #f0e6ff);
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            max-width: 600px;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        h1 {
            color: #FF1493;
            font-size: 2.5rem;
            margin: 0 0 20px 0;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .game-info {
            display: flex;
            justify-content: space-around;
            margin: 15px 0;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .score, .level {
            color: #FF69B4;
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 5px;
            background: linear-gradient(135deg, #fff9e6, #f0e6ff);
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            border: 3px solid #FF69B4;
            min-height: 400px;
        }

        .puyo {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            animation: bounce 0.5s ease;
        }

        .puyo.red {
            background: linear-gradient(135deg, #FF6347, #FF4500);
        }

        .puyo.yellow {
            background: linear-gradient(135deg, #FFD700, #FFA500);
        }

        .puyo.blue {
            background: linear-gradient(135deg, #00BFFF, #0099CC);
        }

        .puyo.green {
            background: linear-gradient(135deg, #32CD32, #228B22);
        }

        .puyo.purple {
            background: linear-gradient(135deg, #9370DB, #8B008B);
        }

        .puyo.pink {
            background: linear-gradient(135deg, #FF69B4, #FF1493);
        }

        .puyo.empty {
            background: transparent;
            box-shadow: none;
            animation: none;
        }

        .puyo.current {
            opacity: 0.8;
            border: 2px solid white;
        }

        @keyframes bounce {
            0% { transform: scale(0.8); }
            100% { transform: scale(1); }
        }

        .controls-buttons {
            margin: 20px 0;
        }

        button {
            background: linear-gradient(135deg, #FF69B4, #FF1493);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            margin: 5px;
            font-weight: bold;
            transition: transform 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(255, 105, 180, 0.4);
        }

        .controls-info {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            border-left: 4px solid #FF69B4;
            text-align: left;
        }

        .controls-info h3 {
            color: #FF69B4;
            margin: 0 0 10px 0;
        }

        .controls-info p {
            margin: 5px 0;
            color: #333;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            h1 {
                font-size: 2rem;
            }
            .game-board {
                min-height: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌸 Flower Puyo Puyo 🌸</h1>
        
        <div class="game-info">
            <div class="score">Score: <span id="score">0</span></div>
            <div class="level">Level: <span id="level">1</span></div>
        </div>

        <div id="game-board" class="game-board"></div>

        <div class="controls-buttons">
            <button id="start-btn">Start</button>
            <button id="pause-btn">Pause</button>
            <button id="reset-btn">Reset</button>
        </div>

        <div class="controls-info">
            <h3>操作方法</h3>
            <p>⬅️ ➡️ : 左右移動</p>
            <p>⬇️ : 下移動</p>
            <p>⬆️ : 回転</p>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
