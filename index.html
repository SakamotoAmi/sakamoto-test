<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flower Puyo Puyo Game</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #282c34;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
        }
        canvas {
            border: 1px solid #ffffff;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="200" height="400"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const cols = 10;
        const rows = 20;
        const gridSize = 20;
        const colors = ['#FF0000', '#00FF00', '#0000FF', '#FFFF00', '#FF00FF', '#00FFFF'];

        let board = [];
        let currentPiece;
        let score = 0;
        let difficulty = 1;

        function initBoard() {
            board = Array.from(Array(rows), () => Array(cols).fill(0));
        }

        function drawBoard() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (board[r][c]) {
                        ctx.fillStyle = colors[board[r][c] - 1];
                        ctx.fillRect(c * gridSize, r * gridSize, gridSize, gridSize);
                    }
                }
            }
        }

        function dropPiece() {
            currentPiece = { x: Math.floor(cols / 2) - 1, y: 0, shape: [[1, 1], [1, 1]], color: 1 }; // Simple 2x2 block
            if (!isValidPosition(currentPiece)) {
                alert('Game Over!');
                initBoard();
                score = 0;
            }
        }

        function isValidPosition(piece) {
            for (let r = 0; r < piece.shape.length; r++) {
                for (let c = 0; c < piece.shape[r].length; c++) {
                    if (piece.shape[r][c]) {
                        const newRow = piece.y + r;
                        const newCol = piece.x + c;
                        if (newCol < 0 || newCol >= cols || newRow >= rows || (newRow >= 0 && board[newRow][newCol])) {
                            return false;
                        }
                    }
                }
            }
            return true;
        }

        function mergePiece() {
            for (let r = 0; r < currentPiece.shape.length; r++) {
                for (let c = 0; c < currentPiece.shape[r].length; c++) {
                    if (currentPiece.shape[r][c]) {
                        board[currentPiece.y + r][currentPiece.x + c] = currentPiece.color;
                    }
                }
            }
            clearLines();
        }

        function clearLines() {
            for (let r = rows - 1; r >= 0; r--) {
                if (board[r].every(cell => cell)) {
                    board.splice(r, 1);
                    board.unshift(Array(cols).fill(0));
                    score += 10;
                }
            }
        }

        function update() {
            currentPiece.y++;
            if (!isValidPosition(currentPiece)) {
                currentPiece.y--;
                mergePiece();
                dropPiece();
            }
            drawBoard();
        }

        function gameLoop() {
            update();
            setTimeout(gameLoop, 1000 / difficulty);
        }

        document.addEventListener('keydown', (event) => {
            if (event.key === 'ArrowLeft') {
                currentPiece.x--;
            } else if (event.key === 'ArrowRight') {
                currentPiece.x++;
            } else if (event.key === 'ArrowDown') {
                currentPiece.y++;
            } else if (event.key === 'ArrowUp') {
                // Add rotation if needed
            }
            if (!isValidPosition(currentPiece)) {
                if (event.key === 'ArrowLeft') currentPiece.x++;
                if (event.key === 'ArrowRight') currentPiece.x--;
                if (event.key === 'ArrowDown') currentPiece.y--;
            }
        });

        initBoard();
        dropPiece();
        gameLoop();
    </script>
</body>
</html>
